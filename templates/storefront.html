<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ seller.shop_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased selection:bg-blue-600 selection:text-white">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-md flex flex-col pb-28 relative">
        
        <div class="bg-gray-50 border-b px-4 py-2 flex justify-end items-center gap-1.5 text-[10px] font-black">
            <a href="/{{ seller.username }}/set-lang?lang=km" class="px-2 py-1 rounded-md border {% if lang == 'km' %}bg-blue-600 text-white border-blue-600{% else %}bg-white text-gray-500{% endif %}">🇰🇭 KM</a>
            <a href="/{{ seller.username }}/set-lang?lang=en" class="px-2 py-1 rounded-md border {% if lang == 'en' %}bg-blue-600 text-white border-blue-600{% else %}bg-white text-gray-500{% endif %}">🇬🇧 EN</a>
        </div>

        <header class="p-6 text-center border-b space-y-3 bg-white">
            <img src="{{ seller.logo_url if seller.logo_url else 'https://placehold.co/150?text=Logo' }}" class="w-20 h-20 mx-auto rounded-full object-cover border-2 border-gray-100 shadow-sm bg-gray-50">
            <div>
                <h1 class="text-xl font-black text-gray-900 tracking-tight">{{ seller.shop_name }}</h1>
                <p class="text-xs text-blue-600 font-bold mt-0.5">📞 {{ txt.contact }} {{ seller.phone }}</p>
            </div>
        </header>

        {% if categories %}
        <div class="bg-white border-b sticky top-0 z-40 p-3 flex gap-2 overflow-x-auto no-scrollbar">
            <button id="pill-all" onclick="filterCategorySelection('all')" class="flex-shrink-0 px-4 py-2 rounded-xl text-xs font-black border transition-all bg-blue-600 text-white border-blue-600">
                {{ txt.all_pill }}
            </button>
            {% for cat in categories %}
            <button id="pill-{{ cat.id }}" onclick="filterCategorySelection('{{ cat.id }}')" class="pill-btn flex-shrink-0 px-4 py-2 rounded-xl text-xs font-black border border-gray-200 bg-gray-50 text-gray-500 hover:bg-gray-100 transition-all">
                {{ cat.name }}
            </button>
            {% endfor %}
        </div>
        {% endif %}

        <main class="p-4 flex-1">
            <div id="store-products-grid" class="grid grid-cols-2 gap-3.5"></div>

            <div id="catalog-empty-display" class="hidden text-center py-24 px-6 space-y-3">
                <div class="text-4xl">📦</div>
                <h3 class="font-bold text-gray-800 text-sm">{{ txt.empty_title }}</h3>
                <p class="text-xs text-gray-400 max-w-[200px] mx-auto leading-normal planetary-tracker">{{ txt.empty_desc }}</p>
            </div>
        </main>

        <div id="floating-cart-bar" class="hidden fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-100 shadow-[0_-12px_40px_rgba(0,0,0,0.12)] p-4 z-50 animate-slide-up rounded-t-3xl space-y-3">
            
            <div onclick="toggleCartDrawerDetailsView()" class="flex justify-between items-center cursor-pointer border-b border-gray-50 pb-2">
                <div>
                    <div class="text-[9px] text-gray-400 font-black uppercase tracking-wider">{{ txt.cart_summary }}</div>
                    <div class="flex items-baseline gap-1.5 mt-0.5">
                        <span id="cart-total-qty" class="text-xs font-black text-gray-900 bg-gray-100 px-2 py-0.5 rounded-lg">0</span>
                        <span id="cart-total-price" class="text-base font-black text-blue-600">$0.00</span>
                    </div>
                </div>
                <div id="drawer-arrow-indicator" class="text-xs font-bold text-gray-400 bg-gray-50 border px-2 py-1 rounded-lg transition-transform duration-300">▲</div>
            </div>

            <div id="cart-drawer-items-list" class="hidden max-h-40 overflow-y-auto divide-y divide-gray-50 no-scrollbar py-1"></div>

            <button onclick="checkoutViaTelegram()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black text-xs py-3 rounded-xl shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                {{ txt.checkout_btn }}
            </button>
        </div>

    </div>

    <script>
        const catalogItems = {{ products_data | tojson | safe }};
        let activeFilterId = "all";
        let shoppingCart = {}; 
        let isDrawerExpanded = false;

        function renderStorefrontCatalogView() {
            const grid = document.getElementById("store-products-grid");
            const emptyState = document.getElementById("catalog-empty-display");
            if (!grid) return;

            grid.innerHTML = "";
            
            const filtered = catalogItems.filter(p => {
                if (activeFilterId === "all") return true;
                return String(p.category_id) === String(activeFilterId);
            });

            if (filtered.length === 0) {
                emptyState.classList.remove("hidden");
                grid.classList.add("hidden");
                return;
            } else {
                emptyState.classList.add("hidden");
                grid.classList.remove("hidden");
            }

            filtered.forEach(p => {
                const coverImg = p.images.length > 0 && p.images[0] ? p.images[0] : "https://placehold.co/300x300?text=No+Photo";
                const currentQty = shoppingCart[p.id] || 0;
                const card = document.createElement("div");
                card.className = "bg-white border border-gray-100 rounded-2xl overflow-hidden flex flex-col shadow-xs hover:shadow-md transition-all duration-300";
                
                let actionArea = `
                    <button onclick="modifyCartItemQty(${p.id}, 1)" class="w-full mt-2 bg-blue-50 hover:bg-blue-600 text-blue-600 hover:text-white font-bold py-2 rounded-xl text-[11px] transition-all flex items-center justify-center gap-1">
                        {{ txt.add_to_cart }}
                    </button>
                `;

                if (currentQty > 0) {
                    actionArea = `
                        <div class="flex items-center justify-between border border-blue-200 mt-2 rounded-xl overflow-hidden bg-blue-50/50">
                            <button onclick="modifyCartItemQty(${p.id}, -1)" class="px-2.5 py-1.5 font-black text-blue-600 hover:bg-blue-100 text-sm">-</button>
                            <span class="font-black text-xs text-gray-900">${currentQty}</span>
                            <button onclick="modifyCartItemQty(${p.id}, 1)" class="px-2.5 py-1.5 font-black text-blue-600 hover:bg-blue-100 text-sm">+</button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="relative pt-[100%] bg-gray-50 border-b overflow-hidden">
                        <img src="${coverImg}" class="absolute inset-0 w-full h-full object-cover">
                    </div>
                    <div class="p-3 flex-1 flex flex-col justify-between space-y-2">
                        <div>
                            <h4 class="font-bold text-xs text-gray-800 line-clamp-2 leading-snug">${p.name}</h4>
                            <p class="text-[10px] text-gray-400 font-medium line-clamp-1 mt-0.5">${p.description}</p>
                        </div>
                        <div class="pt-1">
                            <div class="text-blue-600 font-black text-xs leading-none">$${p.price.toFixed(2)}</div>
                            <div class="text-[10px] text-gray-400 font-bold mt-1">${p.riel_price} ៛</div>
                            ${actionArea}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            updateFloatingCartUiSummary();
        }

        function modifyCartItemQty(productId, delta) {
            let qty = (shoppingCart[productId] || 0) + delta;
            if (qty <= 0) delete shoppingCart[productId];
            else shoppingCart[productId] = qty;
            renderStorefrontCatalogView();
        }

        function toggleCartDrawerDetailsView() {
            const listContainer = document.getElementById("cart-drawer-items-list");
            const indicator = document.getElementById("drawer-arrow-indicator");
            isDrawerExpanded = !isDrawerExpanded;

            if (isDrawerExpanded) {
                listContainer.classList.remove("hidden");
                indicator.innerText = "▼";
            } else {
                listContainer.classList.add("hidden");
                indicator.innerText = "▲";
            }
        }

        function updateFloatingCartUiSummary() {
            const cartBar = document.getElementById("floating-cart-bar");
            const qtyText = document.getElementById("cart-total-qty");
            const priceText = document.getElementById("cart-total-price");
            const listContainer = document.getElementById("cart-drawer-items-list");
            
            let totalQty = 0;
            let totalPrice = 0;
            listContainer.innerHTML = "";

            Object.keys(shoppingCart).forEach(id => {
                const product = catalogItems.find(item => String(item.id) === String(id));
                if (product) {
                    const itemQty = shoppingCart[id];
                    const itemCost = product.price * itemQty;
                    totalQty += itemQty;
                    totalPrice += itemCost;

                    const row = document.createElement("div");
                    row.className = "flex justify-between items-center py-2 text-xs font-bold text-gray-700";
                    row.innerHTML = `
                        <div class="flex items-center gap-2">
                            <span class="text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded-md text-[10px]">x${itemQty}</span>
                            <span class="truncate max-w-[180px]">${product.name}</span>
                        </div>
                        <span class="text-gray-900 font-mono">$${itemCost.toFixed(2)}</span>
                    `;
                    listContainer.appendChild(row);
                }
            });

            if (totalQty > 0) {
                cartBar.classList.remove("hidden");
                qtyText.innerText = totalQty;
                priceText.innerText = `$${totalPrice.toFixed(2)}`;
            } else {
                cartBar.classList.add("hidden");
                listContainer.classList.add("hidden");
                isDrawerExpanded = false;
                const indicator = document.getElementById("drawer-arrow-indicator");
                if (indicator) indicator.innerText = "▲";
            }
        }

        function checkoutViaTelegram() {
            // FIXED: Automatically structures invoice language matching user selection context
            let invoiceSummary = "";
            if ("{{ lang }}" === "en") {
                invoiceSummary = `🛒 *New Order From Store: {{ seller.shop_name }}*\n\n`;
            } else {
                invoiceSummary = `🛒 *ការកុម្ម៉ង់ថ្មីពីហាង៖ {{ seller.shop_name }}*\n\n`;
            }

            let totalPriceUSD = 0;

            Object.keys(shoppingCart).forEach(id => {
                const product = catalogItems.find(item => String(item.id) === String(id));
                if (product) {
                    const itemQty = shoppingCart[id];
                    const cost = product.price * itemQty;
                    totalPriceUSD += cost;
                    
                    if ("{{ lang }}" === "en") {
                        invoiceSummary += `🔹 *${product.name}* (Qty x${itemQty}) ➔ $${cost.toFixed(2)}\n`;
                    } else {
                        invoiceSummary += `🔹 *${product.name}* (ចំនួន x${itemQty}) ➔ $${cost.toFixed(2)}\n`;
                    }
                }
            });

            if ("{{ lang }}" === "en") {
                invoiceSummary += `\n💵 *Total Bill Summary: $${totalPriceUSD.toFixed(2)}*`;
            } else {
                invoiceSummary += `\n💵 *សរុបប្រាក់រួម៖ $${totalPriceUSD.toFixed(2)}*`;
            }

            const targetTelegramBase = "{{ seller.telegram_link if seller.telegram_link else 'https://t.me/sky_fashion' }}";
            window.open(`${targetTelegramBase}?text=${encodeURIComponent(invoiceSummary)}&parse_mode=Markdown`, '_blank');
        }

        function filterCategorySelection(targetId) {
            activeFilterId = targetId;
            const allPill = document.getElementById("pill-all");
            if (allPill) {
                if (targetId === 'all') {
                    allPill.className = "flex-shrink-0 px-4 py-2 rounded-xl text-xs font-black border transition-all bg-blue-600 text-white border-blue-600";
                } else {
                    allPill.className = "flex-shrink-0 px-4 py-2 rounded-xl text-xs font-black border border-gray-200 bg-gray-50 text-gray-500 hover:bg-gray-100";
                }
            }

            document.querySelectorAll(".pill-btn").forEach(btn => {
                const id = btn.id.replace("pill-", "");
                if (id === String(targetId)) {
                    btn.className = "pill-btn flex-shrink-0 px-4 py-2 rounded-xl text-xs font-black border transition-all bg-blue-600 text-white border-blue-600";
                } else {
                    btn.className = "pill-btn flex-shrink-0 px-4 py-2 rounded-xl text-xs font-black border border-gray-200 bg-gray-50 text-gray-500 hover:bg-gray-100";
                }
            });

            renderStorefrontCatalogView();
        }

        window.onload = () => { renderStorefrontCatalogView(); };
    </script>
</body>
</html>
