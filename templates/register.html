<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch Your Store Link</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4 text-gray-800 font-sans">
    <div class="bg-white p-6 sm:p-8 rounded-3xl border shadow-xl w-full max-w-sm space-y-6">
        <div>
            <h1 class="text-xl font-black tracking-tight text-gray-900">Create Storefront Link 🇰🇭</h1>
            <p class="text-xs text-gray-400 mt-1">Get your digital menu link live in seconds.</p>
        </div>

        <form action="/register-shop" method="POST" class="space-y-4 text-xs font-bold">
            <div>
                <label class="block text-gray-400 uppercase mb-1 tracking-wide">Choose Store URL Link Slug</label>
                <div class="flex items-center border rounded-xl overflow-hidden bg-gray-50 p-1">
                    <span class="text-gray-400 font-mono px-2 text-sm">shop.kh/</span>
                    <input type="text" name="username" required placeholder="my_shop_name" class="w-full bg-transparent py-2 px-1 text-sm outline-none text-gray-800 font-mono">
                </div>
            </div>

            <div>
                <label class="block text-gray-400 uppercase mb-1 tracking-wide">Public Shop Display Title</label>
                <input type="text" name="shop_name" required placeholder="e.g., Vanna Boutique KH" class="w-full border p-3 rounded-xl text-sm outline-none">
            </div>

            <div>
                <label class="block text-gray-400 uppercase mb-1 tracking-wide">Owner Phone Number</label>
                <input type="tel" name="phone" required placeholder="e.g., 012345678" class="w-full border p-3 rounded-xl text-sm outline-none">
            </div>

            <div>
                <label class="block text-gray-400 uppercase mb-1 tracking-wide">Create 4-Digit Security PIN</label>
                <input type="password" name="pin_code" required pattern="[0-9]{4}" inputmode="numeric" maxlength="4" placeholder="e.g., 2525" class="w-full border p-3 rounded-xl text-sm outline-none tracking-widest text-center font-mono font-black text-gray-900 focus:border-blue-500">
                <p class="text-[10px] text-gray-400 font-medium mt-1">This code protects your dashboard settings. Do not share it.</p>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-black py-3.5 rounded-xl text-sm hover:bg-blue-700 transition-all shadow-md">
                Launch 14-Day Free Trial 🚀
            </button>
        </form>
    </div>
</body>
</html>
